<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Count words, characters, sentences and paragraphs instantly.">
  <meta name="theme-color" content="#4f46e5">
  <title>Word Count</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Word Count</h1>
    <button id="install" class="btn" hidden>Install app</button>
  </header>

  <main>
    <section class="stats" aria-live="polite">
      <div class="stat primary"><span id="words">0</span><label>Words</label></div>
      <div class="stat"><span id="characters">0</span><label>Characters</label></div>
      <div class="stat"><span id="charactersNoSpaces">0</span><label>No spaces</label></div>
      <div class="stat"><span id="emoji">0</span><label>Emoji</label></div>
      <div class="stat"><span id="sentences">0</span><label>Sentences</label></div>
      <div class="stat"><span id="paragraphs">0</span><label>Paragraphs</label></div>
      <div class="stat"><span id="readingTime">0 min</span><label>Reading time</label></div>
    </section>

    <div class="workspace">
      <div class="editor">
        <label for="text" class="visually-hidden">Your text</label>
        <textarea id="text" placeholder="Type or paste your text here…" autofocus spellcheck="true"></textarea>

        <div class="actions">
          <button id="paste" class="btn">Paste</button>
          <label class="btn">Open file<input id="file" type="file" accept=".txt,.md,text/*" hidden></label>
          <button id="copy" class="btn">Copy</button>
          <button id="clear" class="btn danger">Clear</button>
          <span id="status" class="status" role="status"></span>
        </div>

        <details class="top-words">
          <summary>Most used words (<span id="uniqueWords">0</span> unique)</summary>
          <ol id="topWords"></ol>
        </details>
      </div>

      <aside class="thesaurus" aria-labelledby="thesaurus-title">
        <h2 id="thesaurus-title">Thesaurus</h2>
        <form id="lookup-form" class="lookup" role="search">
          <label for="lookup" class="visually-hidden">Word to look up</label>
          <input id="lookup" type="search" placeholder="Find synonyms…" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="btn primary" type="submit">Look up</button>
        </form>
        <div id="thesaurus-results" class="results" aria-live="polite">
          <p class="hint">Select a word in your text to see synonyms, then click one to replace it.</p>
        </div>
        <p class="credit">Synonyms from <a href="https://wordnet.princeton.edu/" target="_blank" rel="noopener">WordNet</a>, Princeton University (<a href="WORDNET-LICENSE.txt" target="_blank">license</a>).</p>
      </aside>
    </div>
  </main>

  <footer>Your text never leaves your device. Works offline, including the thesaurus.</footer>

  <script src="wordcount.js"></script>
  <script src="thesaurus.js"></script>
  <script src="app.js"></script>
</body>
</html>
